spring.application.name=domain-dashboard
# Production (nginx): 8080. Local if 8080 is busy: SERVER_PORT=18080 in backend/.env
server.port=${SERVER_PORT:8080}

# MongoDB Atlas (or local MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/godaddy_dashboard}
spring.data.mongodb.auto-index-creation=true

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-min-32-chars}
app.jwt.expiration-ms=86400000

# AES Encryption for API keys
app.encryption.key=${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}

# GoDaddy API
godaddy.api.base-url=https://api.godaddy.com/v1

# Cache
spring.cache.type=simple

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Admin seed (email is stored as username in MongoDB)
app.admin.email=${ADMIN_EMAIL:godaddy@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Godaddy@123}

# Scheduler
app.sync.interval-ms=${APP_SYNC_INTERVAL_MS:86400000}

# Logging
logging.level.com.godaddy.dashboard=DEBUG
logging.level.org.springframework.security=DEBUG
